[project]
name = "trading-wizzard"
version = "0.1.0"
description = "Free-first local market sentiment, technical, options, macro, and report framework."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "pyyaml>=6.0.1",
  "streamlit>=1.35",
  "typer>=0.12",
]

[project.optional-dependencies]
providers = [
  "feedparser>=6.0.11",
  "praw>=7.7",
  "requests>=2.32",
  "yfinance>=0.2.40",
]
nlp = [
  "torch>=2.2",
  "transformers>=4.41",
]
quant = [
  "optionlab>=1.3",
  "py-vollib>=1.0",
  "vectorbt>=0.26",
]
all = [
  "feedparser>=6.0.11",
  "optionlab>=1.3",
  "praw>=7.7",
  "py-vollib>=1.0",
  "requests>=2.32",
  "torch>=2.2",
  "transformers>=4.41",
  "vectorbt>=0.26",
  "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
twiz = "twiz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
