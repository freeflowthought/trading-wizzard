notes:
  - 20MV定义未解；20日SMA是系统可复核代理，不冒充作者原指标。
  - 作者的宏观事实、资金流及交易盈利陈述均需独立验证；事件概率不等于股指上涨概率。
  - 结构区、ATR缓冲和确认参数是透明工程选择，未按作者预测结果拟合或优化。
