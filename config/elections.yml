# Historical grouping facts only. No price outcomes or fitted market assumptions.
version: us-midterms-1974-2022-v1
verified_at: '2026-10-28T11:14:16+00:00'
parties: {D: Democratic, R: Republican}
definitions:
  before: Party controlling each chamber immediately before the general election.
  after: Party controlling the resulting new Congress, including caucusing independents.
  chambers_flipped: Number of chambers whose controlling party changes, regardless of direction.
  unified: The president's party controls both chambers; the judiciary is outside this definition.
  result_effective_date: Start of the resulting Congress, not the result-call or certification time.
  information_set: Final historical outcomes, not predictors known at the Election Day close.
  results_known_at: Not reconstructed; a null value must not be replaced with Election Day.
control_source_urls:
  - https://history.house.gov/Institution/Presidents-Coinciding/Party-Government/
  - https://www.senate.gov/history/partydiv.htm?lv=true
  - https://history.house.gov/Institution/Party-Divisions/Party-Divisions/
limitations:
  - Election dates denote the nationwide general election; some races require later runoffs or resolution.
  - This roster contains all 13 midterms from 1974 through 2022, before joining any stock returns.
  - Chamber control and party identity alone do not establish a causal stock-return effect.
  - Senate party-division tables sometimes include later membership changes; only control is encoded here.
